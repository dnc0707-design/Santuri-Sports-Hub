        const NAV_ITEMS = ['HOME', 'PLAYERS', 'SPORTS', 'TOURNAMENTS', 'PANCHAYATS', 'REGISTER', 'ABOUT'];

        function getVillageData(id) {
            return VILLAGES.find(v => v.id === id) || { name: 'Unknown', gp: 'Unknown' };
        }

        function calculateStatus(t) {
            if (t.statusOverride && t.statusOverride !== 'Automatic') return t.statusOverride;
            const now = new Date();
            const start = new Date(`${t.startDate}T${t.startTime || '00:00'}`);
            let end = new Date(`${t.endDate}T${t.endTime || '23:59'}`);
            if (isNaN(end.getTime())) end = new Date(`${t.startDate}T23:59`);
            
            if (now < start) return 'Upcoming';
            if (now >= start && now <= end) return 'Live';
            return 'Past';
        }

        function getCountdown(startDate) {
            const start = new Date(startDate);
            const now = new Date();
            start.setHours(0,0,0,0);
            now.setHours(0,0,0,0);
            const diffDays = Math.ceil((start - now) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'Starts Today';
            if (diffDays === 1) return 'Starts Tomorrow';
            if (diffDays > 1) return `Starts in ${diffDays} Days`;
            return '';
        }

        function render() {
            const root = document.getElementById('app-root');
            renderNav();
            
            root.classList.remove('fade-in');
            void root.offsetWidth; // Trigger reflow
            root.classList.add('fade-in');

            switch(state.currentPage) {
                case 'home': root.innerHTML = getHomeHTML(); break;
                case 'tournaments': root.innerHTML = getTournamentsHTML(); attachTournamentEvents(); break;
                case 'tournament-detail': root.innerHTML = getTournamentDetailHTML(); break;
                case 'players': root.innerHTML = getPlayersHTML(); attachPlayerEvents(); break;
                case 'register': root.innerHTML = getRegisterHTML(); attachRegisterEvents(); break;
                case 'admin': 
                    if (state.isAdminLoggedIn) {
                        root.innerHTML = getAdminDashboardHTML();
                        attachAdminEvents();
                    } else {
                        root.innerHTML = getAdminLoginHTML();
                    }
                    break;
                default: 
                    root.innerHTML = `<div class="p-20 text-center max-w-2xl mx-auto"><h2 class="text-3xl font-black mb-4 uppercase">${state.currentPage}</h2><p class="text-gray-500 mb-6">This module is part of the broader Santuri Sports Hub ecosystem.</p><button onclick="navigate('home')" class="text-blue-600 hover:underline font-bold">Return to Home</button></div>`;
            }
        }

        function navigate(page, id = null) {
            state.currentPage = page;
            if (id) state.activeTournamentId = id;
            window.scrollTo(0, 0);
            render();
        }

        function renderNav() {

            const mob = document.getElementById('mobile-nav');

        function getHomeHTML() {

            return `

                    <h1 class="text-4xl md:text-6xl font-black mb-4 tracking-tight">Santuri Sports Hub</h1>

                    <div class="flex justify-between items-end mb-8 border-b border-gray-200 pb-4">

                            <p class="text-gray-500 mt-1">Latest action in Santuri Block</p>
                        </div>

                            </div>
                            <button class="bg-gray-900 text-white px-6 py-2 rounded-lg font-medium whitespace-nowrap">View Live</button>
                        </div>
                    </div>` : ''}

                        ${state.tournaments.slice(0, 3).map(getTournamentCardHTML).join('')}
                    </div>
                </div>
            `;
        }

        function getTournamentCardHTML(t) {
            const status = calculateStatus(t);
            const vData = getVillageData(t.villageId);
            
            let badgeHTML = '';
            if (status === 'Live') badgeHTML = `<span class="bg-red-600 text-white px-3 py-1 rounded-full text-xs font-black shadow flex items-center gap-1 animate-pulse"><span class="w-2 h-2 bg-white rounded-full"></span> LIVE NOW</span>`;
            else if (status === 'Upcoming') badgeHTML = `<span class="bg-amber-500 text-white px-3 py-1 rounded-full text-xs font-black shadow">UPCOMING</span>`;
            else if (status === 'Past') badgeHTML = `<span class="bg-gray-700 text-white px-3 py-1 rounded-full text-xs font-black shadow">PAST</span>`;
            else badgeHTML = `<span class="bg-gray-700 text-white px-3 py-1 rounded-full text-xs font-black shadow uppercase">${status}</span>`;

            return `
                <div onclick="navigate('tournament-detail', '${t.id}')" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden cursor-pointer hover:shadow-lg transition-shadow flex flex-col h-full">
                    <div class="h-48 bg-gray-200 relative">
                        <img src="${t.posterUrl || 'https://placehold.co/800x400/e2e8f0/475569?text=No+Poster'}" class="w-full h-full object-cover">
                        <div class="absolute top-3 right-3 flex flex-col gap-2 items-end">${badgeHTML}</div>
                        <div class="absolute top-3 left-3">
                            <span class="bg-white/95 backdrop-blur px-3 py-1 rounded-full text-xs font-black shadow-sm text-gray-800">
                                ${t.sport} ${t.sport === 'Cricket' && t.type ? `• ${t.type}` : ''}
                            </span>
                        </div>
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        ${status === 'Upcoming' ? `<div class="mb-2 text-amber-600 font-bold text-xs uppercase tracking-wider">${getCountdown(t.startDate)}</div>` : ''}
                        
                        <h3 class="font-black text-xl leading-tight mb-3 text-gray-900">${t.name}</h3>
                        
                        <div class="space-y-2 mb-4 text-sm text-gray-600 font-medium flex-grow">
                            <p class="flex items-center gap-2">📅 ${t.startDate} ${t.endDate && t.endDate !== t.startDate ? `- ${t.endDate}` : ''}</p>
                            <p class="flex items-center gap-2">📍 ${t.venue}, ${vData.name} (${vData.gp} GP)</p>

                            <p class="text-sm font-black text-gray-900">${t.liveUpdates.score}</p>
                        </div>` : ''}
                        
                        ${status === 'Live' && (!t.liveUpdates || !t.liveUpdates.score) ? `
                        <div class="mt-2 mb-4 bg-gray-50 p-3 rounded-lg border border-gray-100 text-center"><p class="text-sm italic text-gray-500 font-medium">Updates coming soon</p></div>
                        ` : ''}

                        <div class="mt-2 mb-4 bg-yellow-50 p-3 rounded-lg border border-yellow-200">
                            <p class="text-xs text-yellow-700 font-bold uppercase mb-1">Winner</p>
                            <p class="text-sm font-black text-yellow-900">${t.results.winner}</p>
                        </div>` : ''}

                        <button class="w-full mt-auto bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 rounded-lg transition-colors">VIEW TOURNAMENT</button>
                    </div>
                </div>
            `;
        }

        function getTournamentsHTML() {

        function setupAutocomplete(searchInputId, dropdownId, hiddenId, displayGpId) {
            const searchInput = document.getElementById(searchInputId);
            const dropdown = document.getElementById(dropdownId);
            const hidden = document.getElementById(hiddenId);
            const gpDisplay = document.getElementById(displayGpId);

            if (!searchInput || !dropdown) return;

            const renderDropdown = (term) => {
                const filtered = VILLAGES.filter(v => v.name.toLowerCase().includes(term.toLowerCase()));
                dropdown.innerHTML = filtered.length > 0 ? filtered.map(v => `
                    <li data-id="${v.id}" data-name="${v.name}" data-gp="${v.gp}" class="autocomplete-item p-4 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0 transition-colors text-left">
                        <div class="font-bold text-gray-900 pointer-events-none">${v.name}</div>
                        <div class="text-xs text-gray-500 uppercase pointer-events-none">${v.gp} GP</div>
                    </li>
                `).join('') : `<li class="p-4 text-gray-500 italic text-sm text-left">No villages found</li>`;

                // Attach click handlers to new items
                dropdown.querySelectorAll('.autocomplete-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        hidden.value = item.getAttribute('data-id');
                        searchInput.value = item.getAttribute('data-name');
                        if (gpDisplay) gpDisplay.value = item.getAttribute('data-gp') + ' GP';
                        dropdown.classList.add('hidden');
                    });
                });
            };

            searchInput.addEventListener('input', (e) => {
                dropdown.classList.remove('hidden');
                renderDropdown(e.target.value);
                hidden.value = ''; // Reset ID when typing
                if (gpDisplay) gpDisplay.value = '';
            });

            searchInput.addEventListener('focus', (e) => {
                dropdown.classList.remove('hidden');
                renderDropdown(e.target.value);
            });

            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });
        }

        function setupPhotoDropzone(inputId, dropzoneId, previewContainerId) {
            const photoInput = document.getElementById(inputId);
            const dropzone = document.getElementById(dropzoneId);
            const previewContainer = document.getElementById(previewContainerId);

            if (!photoInput || !dropzone) return;

            photoInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    previewContainer.innerHTML = `
                        <img src="${url}" class="mx-auto h-24 w-24 object-cover rounded-xl shadow-sm border-2 border-white">
                        <div class="flex text-sm text-gray-600 justify-center mt-2">
                            <span class="relative cursor-pointer bg-transparent rounded-md font-bold text-blue-600 hover:text-blue-500">Change Photo</span>
                        </div>
                    `;
                }
            });

            dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-blue-500', 'bg-blue-50'); });
            dropzone.addEventListener('dragleave', (e) => { e.preventDefault(); dropzone.classList.remove('border-blue-500', 'bg-blue-50'); });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('border-blue-500', 'bg-blue-50');
                if (e.dataTransfer.files.length) {
                    photoInput.files = e.dataTransfer.files;
                    photoInput.dispatchEvent(new Event('change'));
                }
            });
        }

        function attachRegisterEvents() {
            setupAutocomplete('regVillageSearch', 'regVillageDropdown', 'regVillageId', 'regGpDisplay');
            setupPhotoDropzone('regPhoto', 'photoDropzone', 'photoPreviewContainer');

            const form = document.getElementById('registerForm');
            if(!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.innerText;
                submitBtn.innerText = "Registering Player...";
                submitBtn.disabled = true;

                const name = document.getElementById('regName').value.trim();
                const phone = document.getElementById('regPhone').value.trim();
                const age = document.getElementById('regAge').value;
                const vId = document.getElementById('regVillageId').value;
                const sport = document.getElementById('regSport').value;
                const role = document.getElementById('regRole').value;
                const photoInput = document.getElementById('regPhoto');

                if (!vId) {
                    alert("Please select a valid Village from the dropdown list.");
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                    return;
                }

                try {
                    let photoUrl = null;
                    if (photoInput.files && photoInput.files[0]) {
                        const file = photoInput.files[0];
                        const storageRef = ref(storage, `artifacts/${systemAppId}/public/data/photos/${Date.now()}_${file.name}`);
                        const snapshot = await uploadBytes(storageRef, file);
                        photoUrl = await getDownloadURL(snapshot.ref);
                    }

                    const vData = getVillageData(vId);
                    const newPlayer = {
                        name: name,
                        phone: phone,
                        age: age ? parseInt(age) : null,
                        villageId: vId,
                        gpId: vData.gp,
                        sport: sport,
                        role: role,
                        photoUrl: photoUrl,
                        createdAt: Date.now()
                    };
                    
                    await addDoc(collection(db, 'artifacts', systemAppId, 'public', 'data', 'players'), newPlayer);

                    form.classList.add('hidden');
                    document.getElementById('regSuccessMsg').classList.remove('hidden');
                    window.scrollTo(0, 0);
                } catch (error) {
                    console.error("Error registering player:", error);
                    alert("There was an error saving your registration.");
                } finally {
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }
            });
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;
            if (u === 'admin' && p === '1234') {
                state.isAdminLoggedIn = true;
                render();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleAdminLogout() {
            state.isAdminLoggedIn = false;
            navigate('home');
        }

        function getAdminDashboardHTML() {
            return `
                <div class="max-w-5xl mx-auto px-4 py-12">
                    <div class="flex justify-between items-center mb-8 border-b pb-4">
                        <h1 class="text-3xl font-black text-gray-900">Admin Panel: Tournaments</h1>
                        <button onclick="handleAdminLogout()" class="bg-red-100 text-red-600 hover:bg-red-200 font-bold py-2 px-6 rounded-lg transition-colors">Logout</button>
                    </div>

                    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm mb-8">
                        <h2 class="text-xl font-black text-gray-900 mb-6 border-b border-gray-100 pb-2">Create New Tournament</h2>
                        <form id="adminTournamentForm" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Tournament Name *</label>
                                    <input type="text" id="tName" required class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Sport *</label>
                                    <select id="tSport" required class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 cursor-pointer">
                                        ${SPORTS.map(s => `<option value="${s}">${s}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Tournament Type</label>
                                    <input type="text" id="tType" placeholder="e.g. Village Tournament, Tennis Cricket" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Start Date *</label>
                                    <input type="date" id="tStartDate" required class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">End Date</label>
                                    <input type="date" id="tEndDate" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500">
                                </div>
                                
                                <!-- Village Autocomplete for Admin -->
                                <div class="md:col-span-2 relative">
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Venue Village *</label>
                                    <input type="hidden" id="adminVillageId" required>
                                    <input type="text" id="adminVillageSearch" autocomplete="off" placeholder="Type to search village..." class="w-full border border-gray-300 rounded-lg p-3 font-medium focus:ring-2 focus:ring-blue-500 bg-gray-50 focus:bg-white cursor-text">
                                    <ul id="adminVillageDropdown" class="hidden absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-xl max-h-60 overflow-y-auto"></ul>
                                </div>

                                <div class="md:col-span-2">
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Venue Name *</label>
                                    <input type="text" id="tVenue" required placeholder="e.g. High School Ground" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500">
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Organizer</label>
                                    <input type="text" id="tOrganizer" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500">
                                </div>

                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Status Override</label>
                                    <select id="tStatus" class="w-full border border-gray-300 rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 cursor-pointer">
                                        <option value="Automatic">Automatic (Based on Dates)</option>
                                        <option value="Upcoming">Upcoming</option>
                                        <option value="Live">Live</option>
                                        <option value="Past">Past</option>
                                        <option value="Postponed">Postponed</option>
                                        <option value="Cancelled">Cancelled</option>
                                    </select>
                                </div>
                                
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-bold text-gray-700 mb-1">Tournament Poster</label>
                                    <input type="file" id="tPoster" accept="image/*" class="w-full border border-gray-300 rounded-lg p-2 bg-gray-50">

                            <div class="pt-6 border-t border-gray-100 flex justify-end">

        }

        function attachAdminEvents() {
            setupAutocomplete('adminVillageSearch', 'adminVillageDropdown', 'adminVillageId', null);
            
            const form = document.getElementById('adminTournamentForm');
            if(!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.innerText;
                submitBtn.innerText = "Publishing...";
                submitBtn.disabled = true;

                const vId = document.getElementById('adminVillageId').value;
                if (!vId) {
                    alert("Please select a valid Venue Village from the dropdown.");
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                    return;
                }

                try {
                    let posterUrl = null;
                    const posterInput = document.getElementById('tPoster');
                    if (posterInput.files && posterInput.files[0]) {
                        const file = posterInput.files[0];
                        const storageRef = ref(storage, `artifacts/${systemAppId}/public/data/photos/${Date.now()}_${file.name}`);
                        const snapshot = await uploadBytes(storageRef, file);
                        posterUrl = await getDownloadURL(snapshot.ref);
                    }

                    const vData = getVillageData(vId);
                    
                    const newT = {
                        name: document.getElementById('tName').value,
                        sport: document.getElementById('tSport').value,
                        type: document.getElementById('tType').value,
                        startDate: document.getElementById('tStartDate').value,
                        endDate: document.getElementById('tEndDate').value,
                        venue: document.getElementById('tVenue').value,
                        villageId: vId,
                        gpId: vData.gp,
                        organizer: document.getElementById('tOrganizer').value,
                        statusOverride: document.getElementById('tStatus').value,
                        posterUrl: posterUrl,
                        createdAt: Date.now()
                    };
                    
                    await addDoc(collection(db, 'artifacts', systemAppId, 'public', 'data', 'tournaments'), newT);
                    
                    alert("Tournament Published Successfully!");
                    form.reset();
                    document.getElementById('adminVillageId').value = '';
                } catch(err) {
                    console.error("Error creating tournament", err);
                    alert("Failed to create tournament.");
                } finally {
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                }
            });
        }

        window.onload = async () => {
            try {
                // Sign in anonymously to allow Firestore read/write rules
                await signInAnonymously(auth);
                const user = auth.currentUser;
                
                if (user) {
                    // Sync Players
                    onSnapshot(collection(db, 'artifacts', systemAppId, 'public', 'data', 'players'), (snapshot) => {
                        state.players = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        render();
                    }, (err) => console.error("Players fetch error:", err));

                    // Sync Tournaments
                    onSnapshot(collection(db, 'artifacts', systemAppId, 'public', 'data', 'tournaments'), (snapshot) => {
                        state.tournaments = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        render();
                    }, (err) => console.error("Tournaments fetch error:", err));
                }
            } catch (error) {
                console.error("Firebase Auth Error:", error);
            }
            render();
        };

    </script>
</body>
</html>
